name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # Pinned deliberately: `@latest` would make builds non-reproducible and let an
  # upstream release break main. Bump this by hand after checking the changelog.
  # Note netlify-cli 27 requires Node >= 22.13, which is why .nvmrc pins 22.
  NETLIFY_CLI_VERSION: 27.1.1

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this is the typecheck too.
      - name: Build
        run: npm run build

      # Fork PRs get no secrets, so deploying would fail red for contributors.
      # They still get the full build/typecheck above; only the upload is skipped.
      # Do NOT switch to pull_request_target to work around this — that would run
      # untrusted code with these secrets in scope.
      - name: Deploy to Netlify
        id: deploy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          # Passed via env rather than interpolated into the script: never inline
          # ${{ }} of attacker-controllable values (branch names, PR titles) into run.
          DEPLOY_MESSAGE: ${{ github.sha }}
          PROD_FLAG: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
        run: |
          set -euo pipefail
          # $PROD_FLAG is intentionally unquoted so an empty value expands to nothing.
          npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" deploy \
            --dir=dist \
            --message="$DEPLOY_MESSAGE" \
            $PROD_FLAG \
            --json | tee deploy.json
          echo "url=$(jq -r '.deploy_url // empty' deploy.json)" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Deploy preview: ${process.env.PREVIEW_URL}`,
            })
